# Seeded once by tier2-project. The content below is this project's own — nothing ever overwrites it.
#
# `requires-python` is the one line the estate's CI depends on. tier-1-ci's runner resolves it to an
# installed interpreter and REFUSES to run the suite if nothing satisfies it, rather than testing on
# whatever `python3` happens to be on PATH (software-development-standards.md, "Python runtime
# policy for host-side Python"). That applies even to a shell-only suite, because the venv is built
# either way.
#
# NARROW IT TO WHAT THIS SERVICE SHIPS. If the Dockerfile says `python:3.12-slim`, this should say
# `==3.12.*`. A wide range is not caution, it is a different interpreter: `>=3.9` resolves to 3.9 and
# would test code that runs on 3.12 in production. Two repositories in this estate declared `>=3.9`
# while shipping 3.11, and one of them does not run on 3.14 at all.
[project]
name = "investment-reviews"
version = "0.0.0"
requires-python = "==3.13.*"

# Metadata only: this service has no installable package. Its modules are single files at the repository
# root, imported by name, which is why tests/conftest.py puts the root on sys.path rather than relying on
# an editable install.
[tool.setuptools]
packages = []
