services:
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: investment-reviews-scheduler
    container_name: investment-reviews-scheduler
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=${TZ}
      - CONFIG_PATH=${CONFIG_PATH}
      - SCHEDULE_LOCAL_TIME=${SCHEDULE_LOCAL_TIME}
    volumes:
      - ${CONFIG_DIR}:/run/config:ro
      - ${CREDENTIALS_DIR}:/run/credentials:ro
      - ${HISTORY_DIR}:/data/history:ro
      - ${OUTPUTS_DIR}:/data/outputs
      - ${LOG_DIR}:/data/logs
    entrypoint: ["/app/deploy/entrypoints/scheduler.sh"]

  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: investment-reviews-runner
    container_name: investment-reviews-runner
    profiles: ["manual"]
    user: "1000:1000"
    environment:
      - TZ=${TZ}
      - CONFIG_PATH=${CONFIG_PATH}
    volumes:
      - ${CONFIG_DIR}:/run/config:ro
      - ${CREDENTIALS_DIR}:/run/credentials:ro
      - ${HISTORY_DIR}:/data/history:ro
      - ${OUTPUTS_DIR}:/data/outputs
      - ${LOG_DIR}:/data/logs
    entrypoint: ["/app/deploy/entrypoints/run-once.sh"]
