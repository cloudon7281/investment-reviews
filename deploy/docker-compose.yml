services:
  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: investment-reviews-runner
    container_name: investment-reviews-runner
    profiles: ["manual"]
    # NOTE: On macOS/Colima mounts, uid/gid mapping can be inconsistent (9p).
    # Run as root to ensure the runner can write to bind-mounted outputs dir.
    networks:
      # SDI, "Service-to-service endpoints": tier-4-notify is a container on this host, reached
      # over the shared service network by the name registration brokers. This service used to
      # speak SMTP to the Proton Bridge from here; the relay, the credential and the addresses are
      # all tier-4-notify's now (devops-model#264).
      estate_services:
    environment:
      - TZ=Europe/London
      # SDI, "Service-to-service endpoints": `host:port`, unsplit — this is a URL's authority, not
      # two arguments to a client library.
      - CONSUMED_NOTIFY=${CONSUMED_NOTIFY:-}
      - CONFIG_PATH=/run/config/config.yaml
      - LOG_FORMAT=json
      - METRICS_TEXTFILE_DIR=/textfile
    # SDI, "Secrets": the Google service-account key, read by google_sheets_client.py at
    # /run/secrets/google_sheets_service_account.json. Read once per run, so a rotation reaches the
    # next nightly run with nothing restarted (SDI, "Rotation").
    secrets:
      - source: google_sheets_sa
        target: google_sheets_service_account.json
    volumes:
      - ${STATE_DIR}/config:/run/config:ro
      - ${STATE_DIR}/history:/data/history:ro
      - ${STATE_DIR}/outputs:/data/outputs
      # SDI, "Shared stores" (metrics-textfile); node_exporter scrapes *.prom here.
      - ${SHARED_METRICS_TEXTFILE}:/textfile:rw
    entrypoint: ["/app/deploy/entrypoints/run-once.sh"]

secrets:
  # Seeded by `tier2-project register-service --seed-secret-file`, replaced in place by
  # `tier2-project rotate-secret` (docs/operations.md, "The Google service-account key").
  google_sheets_sa:
    file: ${STATE_DIR}/secrets/google_sheets_service_account.json

networks:
  # networking-model.md, "Shared service network": created by the platform on every host;
  # referenced, never defined here.
  estate_services:
    external: true
