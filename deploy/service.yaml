# SDI v1 service manifest — see ~/clawd/docs/deployment-architecture/service-deploy-interface-v1.md §2.3
# Tier-1 kicker schedules (optional) — see ~/clawd/docs/deployment-architecture/tier1-kicker-v0.md

stack: investment-reviews

# SDI §1.2a state budget (devops-model#114). An expected ceiling for ${STATE_DIR}, not a
# quota — nothing enforces it. Tier-4 alerts at 80%/100% so the shared host volume filling
# is announced rather than discovered.
# state/history appends indefinitely but slowly (~87M today).
state:
  maxSizeGb: 1

# No inbound ports for this stack.
ports: []

# Explicitly mark this stack as jobs-only.
# Back-compat default is always-on for stacks that omit this.
lifecycle: jobs-only

# SDI §12 — mount monitoring's metrics-textfile store rw so the nightly job can
# emit a node_exporter textfile metric (SDI §11 jobs-only metrics). Registration
# resolves this to SHARED_METRICS_TEXTFILE in deploy.env and pre-creates the dir.
sharedMounts:
  - store: metrics-textfile
    mode: rw

backup:
  enabled: true
  mode: crash-consistent
  exclusions: []
  notes: Runner state is ordinary host files under STATE_DIR; crash-consistent artifact backup is acceptable for phase 2.

jobsOnly:
  prebuild:
    profile: manual
    services: [runner]

schedules:
  - id: nightly
    enabled: true
    timezone: Europe/London

    when:
      type: daily_at
      time: "22:05"

    catchUp:
      enabled: true
      maxLateMinutes: 720

    job:
      type: command
      cwd: ${CURRENT_DIR}/deploy
      command:
        - /bin/sh
        - -lc
        # --env-file loads deploy.env so SHARED_METRICS_TEXTFILE (and other SDI
        # vars) resolve for compose interpolation at kicker-run time; deploy-service
        # only passes --env-file at deploy time, not on scheduled runs.
        - "STATE_DIR=${STATE_DIR} docker compose --env-file ${STATE_DIR}/env/deploy.env --profile manual run --rm runner"

    policy:
      timeoutSec: 7200
      concurrency:
        hostLock: true
        lockWaitSec: 0

# SDI §11 (devops-model#85 / #87 Phase 3): nightly pipeline — emits its own node_exporter textfile,
# and its liveness is whether that file was written recently. maxAgeSec ~36h (matches the retired
# health-rule's window) so one missed night is tolerated.
# SDI §11.1: a LIST, one entry per family (devops-model#164). The alert-channel health is tracked
# independently of the pipeline — that is the whole point of it, so "the email is broken" cannot hide
# behind a green pipeline — and until the list existed it could not be declared alongside the
# pipeline metric, so it was invisible to the §12.6 audit.
metrics:
  - mode: prom
    file: investment-reviews.prom
  - mode: prom
    file: investment-reviews-alert.prom
# SDI §11.2: with more than one family the platform must not pick, so name the one that carries the
# verdict. Liveness is "did the nightly pipeline run" — the alert-channel file is deliberately a
# SEPARATE signal, so that a broken email channel cannot hide behind a green pipeline, and it must
# not be the thing that decides whether this service is alive.
health:
  mode: prom
  file: investment-reviews.prom
  maxAgeSec: 129600
