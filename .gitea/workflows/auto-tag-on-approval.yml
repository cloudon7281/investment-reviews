name: auto-tag-on-approval

on:
  pull_request:
    types: [closed]

jobs:
  auto-tag:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge, tag and close issue
        env:
          TOKEN: ${{ secrets.AUTO_TAG_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.server_url }}/api/v1
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: token ${TOKEN}" \
            "${API_BASE}/repos/${REPO}/contents/.gitea/scripts/auto-tag.py" \
            | python3 -c "import sys,json,base64; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)['content']))" \
            > /tmp/auto-tag.py
          python3 /tmp/auto-tag.py
