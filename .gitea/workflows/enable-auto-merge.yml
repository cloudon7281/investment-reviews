name: enable-auto-merge

on:
  pull_request:
    types: [opened, reopened]

jobs:
  manage-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge on open and on reopen
        env:
          TOKEN: ${{ secrets.AUTO_TAG_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          API_BASE: ${{ github.server_url }}/api/v1
        run: |
          # Refresh mergeability before arming (tier-1-gitea#14). Arming
          # auto-merge while Gitea is still running its first mergeability
          # check (mergeable reported false during "checking") can wedge the
          # cache to a stuck mergeable:false that never recovers -- the
          # go-gitea bug behind tier-1-gitea#6, amplified when the base
          # advances mid-check in a busy multi-PR epic. Re-poll until the
          # check settles to mergeable:true, then arm on a confirmed-true
          # state instead of trusting a possibly-stale false. Fail open (arm
          # anyway) if it never settles, so behaviour is never worse than the
          # arm-immediately baseline.
          for _ in $(seq 1 15); do
            MERGEABLE=$(curl -fsSL -H "Authorization: token ${TOKEN}" \
              "${API_BASE}/repos/${REPO}/pulls/${PR_NUMBER}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('mergeable'))" 2>/dev/null || true)
            [ "${MERGEABLE}" = "True" ] && break
            sleep 2
          done
          if [ "${MERGEABLE}" = "True" ]; then
            echo "mergeable confirmed; arming auto-merge for PR ${PR_NUMBER}"
          else
            echo "mergeability unresolved after polling; arming auto-merge anyway (fail-open) for PR ${PR_NUMBER}"
          fi
          curl -fsSL -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"Do":"merge","merge_when_checks_succeed":true}' \
            "${API_BASE}/repos/${REPO}/pulls/${PR_NUMBER}/merge" || true
