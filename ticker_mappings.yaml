# Mappings from what a broker note says to what Yahoo Finance calls the same security.
#
# Data, not code, and kept here rather than in a state directory so that a change is
# reviewable and revertible: a wrong mapping misprices a holding silently, and
# investment-reviews#50 showed that costing a 49% phantom loss on a flat position.
#
# There are three separate problems here, and they are not interchangeable:
#
#   names             a note that carries no ticker at all — unit trusts and OEICs —
#                     identified by the stock name the note does carry
#   exchange_suffixes the Yahoo suffix implied by an ISIN's country of domicile
#   ticker_suffixes   per-ticker overrides, because domicile is not listing venue: a
#                     London-listed fund with an Irish ISIN needs .L, and one exchange
#                     carries lines of the same fund in several currencies
#   renames           a ticker that became another ticker
#
# An entry may be a plain value, or a mapping with a `note` recording why it is not
# obvious. Prefer the note: it is the part that is expensive to rediscover.
#
# check_notes.py verifies these against the market. Run it over new notes before copying
# them into the live tree (investment-reviews#59).

